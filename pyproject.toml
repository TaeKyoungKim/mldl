[project]
name = "mldl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lightgbm>=4.7.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.22.0rc0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ucimlrepo>=0.0.7",
    "xgboost>=3.4.1",
]

[project.scripts]
mldl = "mldl:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
